services:
  db:
    image: postgres:15-alpine
    container_name: seguros_db
    restart: always
    environment:
      POSTGRES_USER: corretor_admin
      POSTGRES_PASSWORD: seguro_tech_2024
      POSTGRES_DB: calendario_seguros
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corretor_admin -d calendario_seguros"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seguros_backend
    restart: always
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: corretor_admin
      DATABASE_PASSWORD: seguro_tech_2024
      DATABASE_NAME: calendario_seguros
      PORT: 3000
      JWT_SECRET: chave-secreta-forti-seguros-jwt-super-segura-2024
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: seguros_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
